# fly.toml app configuration file generated for seilapohakakaka on 2026-09-04T15:42:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'seilapohakakaka'
primary_region = 'gru'

[
build
]
  builder = "dockerfile"

[
env
]
  PORT = "443"

[[
services
]]
  internal_port = 443
  protocol = "tcp"

  [[
services.ports
]]
    port = 443
    handlers = ["tls"]

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 443
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
